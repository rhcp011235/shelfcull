services:
  shelfcull:
    build: .
    # image: ghcr.io/OWNER/shelfcull:latest    # if you publish an image, use it here and drop "build"
    container_name: shelfcull
    restart: unless-stopped
    env_file: .env                 # copy .env.example to .env and fill it in
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data               # your marks live here; must be writable by uid 1000 (or set "user:" below)
    # user: "1000:1000"
